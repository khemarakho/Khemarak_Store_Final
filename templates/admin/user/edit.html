{% extends 'admin/master.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Edit User</h2>

    <a
        href="{{ url_for('admin.admin_users') }}"
        class="btn btn-secondary"
    >
        <i class="fa fa-arrow-left"></i>
        Back
    </a>

</div>


<div class="card shadow">

    <div class="card-body">

        <form
            action="{{ url_for('admin.edit') }}"
            method="POST"
            enctype="multipart/form-data"
        >

            <!-- USER ID -->

            <input
                type="hidden"
                name="user_id"
                value="{{ user.id }}"
            >


            <!-- =====================================
                 PROFILE IMAGE
            ====================================== -->

            <div class="mb-4 text-center">

                {% if user.image %}

                    <img
                        id="preview"
                        src="{{ url_for(
                            'static',
                            filename='uploads/users/' ~ user.image
                        ) }}"
                        width="120"
                        height="120"
                        class="rounded-circle border"
                        style="object-fit: cover;"
                    >

                {% else %}

                    <img
                        id="preview"
                        src="{{ url_for(
                            'static',
                            filename='image/default.jpg'
                        ) }}"
                        width="120"
                        height="120"
                        class="rounded-circle border"
                        style="object-fit: cover;"
                    >

                {% endif %}


                <div class="mt-3">

                    <label class="form-label d-block">
                        Profile Image
                    </label>


                    <input
                        type="file"
                        class="form-control"
                        name="image"
                        accept=".jpg,.jpeg,.png,.gif"
                        onchange="previewImage(event)"
                    >
                </div>

            </div>


            <!-- =====================================
                 NAME
            ====================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ user.name }}"
                    required
                >

            </div>


            <!-- =====================================
                 EMAIL
            ====================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    name="email"
                    value="{{ user.email }}"
                    required
                >

            </div>


            <!-- =====================================
                 PASSWORD
            ====================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="password"
                    placeholder="Leave empty to keep current password"
                >

            </div>


            <!-- =====================================
                 ROLE
            ====================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Role
                </label>

                <select
                    class="form-select"
                    name="role"
                    required
                >

                    <option
                        value="user"
                        {% if user.role == 'users' %}
                            selected
                        {% endif %}
                    >
                        User
                    </option>


                    <option
                        value="admin"
                        {% if user.role == 'admin' %}
                            selected
                        {% endif %}
                    >
                        Admin
                    </option>

                </select>

            </div>


            <!-- =====================================
                 BUTTONS
            ====================================== -->

            <div class="text-end">

                <a
                    href="{{ url_for('admin.admin_users') }}"
                    class="btn btn-secondary"
                >
                    <i class="fa fa-times"></i>
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="fa fa-save"></i>
                    Update User
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}


{% block script %}

<script>

function previewImage(event) {

    const file = event.target.files[0];

    const preview = document.getElementById("preview");


    if (file) {

        preview.src = URL.createObjectURL(file);

    }

}

</script>

{% endblock %}
