{% extends 'admin/master.html' %}

{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">

    <h2 class="fw-bold mb-0">
        <i class="fa-solid fa-user-plus text-primary me-2"></i>Add User
    </h2>

    <a
        href="{{ url_for('admin.admin_users') }}"
        class="btn btn-outline-secondary rounded-pill px-3"
    >
        <i class="fa fa-arrow-left me-1"></i>
        Back
    </a>

</div>


<div class="card shadow">

    <div class="card-body">

        <form
            action="{{ url_for('admin.add') }}"
            method="POST"
            enctype="multipart/form-data"
        >
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- ==========================================
                 PROFILE IMAGE
            =========================================== -->

            <div class="mb-4 text-center">

                <img
                    id="preview"
                    src="{{ url_for(
                        'static',
                        filename='image/default.jpg'
                    ) }}"
                    width="120"
                    height="120"
                    class="rounded-circle border"
                    style="object-fit: cover;"
                >

                <div class="mt-3">

                    <label class="form-label d-block">
                        Profile Image
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        name="image"
                        accept=".jpg,.jpeg,.png,.gif,.webp"
                        onchange="previewImage(event)"
                    >
                </div>

            </div>


            <!-- ==========================================
                 NAME
            =========================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="name"
                    placeholder="Enter full name"
                    required
                >

            </div>


            <!-- ==========================================
                 EMAIL
            =========================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <!-- ==========================================
                 PASSWORD
            =========================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- ==========================================
                 ROLE
            =========================================== -->

            <div class="mb-3">

                <label class="form-label">
                    Role
                </label>

                <select
                    class="form-select"
                    name="role"
                    required
                >

                    <option
                        value="user"
                        selected
                    >
                        User
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <!-- ==========================================
                 BUTTONS
            =========================================== -->

            <div class="text-end">

                <a
                    href="{{ url_for('admin.admin_users') }}"
                    class="btn btn-secondary"
                >
                    <i class="fa fa-times"></i>
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="fa fa-save"></i>
                    Add User
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}


{% block script %}

<script>

function previewImage(event) {

    const file = event.target.files[0];

    const preview = document.getElementById("preview");

    if (file) {

        preview.src = URL.createObjectURL(file);

    }

}

</script>

{% endblock %}
