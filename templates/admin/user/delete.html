{% extends 'admin/master.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Delete User</h2>

    <a
        href="{{ url_for('admin.admin_users') }}"
        class="btn btn-secondary"
    >
        <i class="fa fa-arrow-left"></i>
        Back
    </a>

</div>


<div class="card shadow">

    <div class="card-body text-center">

        {% if user.image %}

            <img
                src="{{ url_for(
                    'static',
                    filename='uploads/users/' ~ user.image
                ) }}"
                width="100"
                height="100"
                class="rounded-circle border mb-3"
                style="object-fit: cover;"
            >

        {% else %}

            <img
                src="{{ url_for(
                    'static',
                    filename='image/default.jpg'
                ) }}"
                width="100"
                height="100"
                class="rounded-circle border mb-3"
                style="object-fit: cover;"
            >

        {% endif %}


        <h4>
            Are you sure?
        </h4>


        <p class="text-muted">

            You are about to delete:

            <strong>
                {{ user.name }}
            </strong>

        </p>


        <p>
            {{ user.email }}
        </p>


        <form
            action="{{ url_for('admin.delete_user') }}"
            method="POST"
        >
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input
                type="hidden"
                name="user_id"
                value="{{ user.id }}"
            >


            <a
                href="{{ url_for('admin.admin_users') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="btn btn-danger"
            >
                <i class="fa fa-trash"></i>
                Yes, Delete
            </button>

        </form>

    </div>

</div>

{% endblock %}
