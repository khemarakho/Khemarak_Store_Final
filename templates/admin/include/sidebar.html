<aside class="sidebar" id="adminSidebar">
    <!-- Drawer Header with Title & Close 'X' Button -->
    <div class="sidebar-header d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Khemarak_Store Logo" style="width: 32px; height: 32px; border-radius: 6px; object-fit: contain;">
            <span class="fw-bold text-dark fs-5 mb-0">Khemarak_Store</span>
        </div>
        <button type="button"
                class="sidebar-close-btn d-lg-none d-flex align-items-center justify-content-center"
                onclick="toggleAdminSidebar()"
                aria-label="Close menu">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Menu Navigation Links -->
    <div class="menu">
        <!-- Dashboard -->
        <a href="{{ url_for('admin.admin_dashboard') }}" class="{{ 'active' if module == 'admin' else '' }}">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>

        <!-- Category -->
        <a href="{{ url_for('admin.admin_categories') }}" class="{{ 'active' if module == 'categories' else '' }}">
            <i class="fa-solid fa-layer-group"></i>
            <span>Category</span>
        </a>

        <!-- Product -->
        <a href="{{ url_for('admin.admin_products') }}" class="{{ 'active' if module == 'products' else '' }}">
            <i class="fa-solid fa-box"></i>
            <span>Product</span>
        </a>

        <!-- Orders -->
        <a href="{{ url_for('admin_orders') }}" class="{{ 'active' if module == 'orders' else '' }}">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Orders</span>
        </a>

        <!-- Users -->
        {% if session.get('user_role') == 'admin' %}
        <a href="{{ url_for('admin.admin_users') }}" class="{{ 'active' if module == 'users' else '' }}">
            <i class="fa-solid fa-users"></i>
            <span>Users</span>
        </a>
        {% endif %}

        <hr class="sidebar-divider">

        <!-- Live Store Link -->
        <a href="{{ url_for('index') }}" target="_blank" class="live-store-link">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span>Live Store</span>
        </a>
    </div>

    <!-- Bottom Admin Profile & Logout Section -->
    <div class="sidebar-footer">
        <hr class="sidebar-divider">
        <div class="sidebar-user-item d-flex align-items-center gap-3 px-3 py-2">
            {% if session.get("user_image") %}
                <img src="{{ url_for('static', filename='uploads/users/' + session.get('user_image')) }}"
                     alt="Avatar" width="32" height="32" class="rounded-circle" style="object-fit: cover;">
            {% else %}
                <i class="fa-solid fa-circle-user fs-4 text-secondary"></i>
            {% endif %}
            <div class="text-truncate">
                <span class="text-dark fw-semibold small">Profile ({{ session.get("user_name", "admin") }})</span>
            </div>
        </div>

        <a href="{{ url_for('admin.admin_logout') }}" class="sidebar-logout-link d-flex align-items-center gap-3 px-3 py-2 text-decoration-none">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>
    </div>
</aside>
