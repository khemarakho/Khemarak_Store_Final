<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .success-card {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 50px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 90px;
            height: 90px;
            background: #e8f8ef;
            color: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 45px;
        }

        .success-card h1 {
            font-size: 32px;
            font-weight: 700;
            color: #222;
            margin-bottom: 12px;
        }

        .success-card p {
            color: #777;
            font-size: 16px;
            line-height: 1.6;
        }

        .order-number {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin: 25px 0;
        }

        .order-number span {
            display: block;
            color: #888;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .order-number strong {
            color: #222;
            font-size: 18px;
        }

        .btn-shop {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }

        .btn-shop:hover {
            background: #0b5ed7;
            color: white;
        }

        .btn-orders {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }

        .btn-orders:hover {
            background: #f5f5f5;
            color: #333;
        }
    </style>
</head>

<body>

<div class="success-card">

    <!-- Success Icon -->
    <div class="success-icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <h1>Order Successful!</h1>

    <p>
        Thank you for your order.
        Your order has been placed successfully.
    </p>

    <!-- Order Number -->
    <div class="order-number">
        <span>Order Number</span>

        <strong>
            #{{ order_id or 'ORD-001' }}
        </strong>
    </div>

    <p>
        We will process your order shortly.
        You will receive an update when your order is shipped.
    </p>

    <!-- Buttons -->
    <div class="mt-4">

        <a href="{{ url_for('index') }}" class="btn-shop">
            <i class="fa-solid fa-cart-shopping me-2"></i>
            Continue Shopping
        </a>

        <a href="{{ url_for('my_orders') }}" class="btn-orders">
            <i class="fa-solid fa-box me-2"></i>
            View Orders
        </a>

    </div>

</div>

</body>
</html>
