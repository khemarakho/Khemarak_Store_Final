<!-- ==========================================
     MOBILE NAVIGATION OVERLAY
=========================================== -->
<div class="mobile-nav-overlay" id="mobileNavOverlay" onclick="toggleMenu()"></div>

<!-- ==========================================
     FRONT STORE HEADER
=========================================== -->
<header class="header">
    <div class="nav-container">
        <!-- Brand Logo -->
        <a href="{{ url_for('index') }}" class="logo">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Khemarak_Store Logo" class="navbar-logo">
            <span>Khemarak_Store</span>
        </a>

        <!-- Desktop Search Bar -->
        <form action="{{ url_for('shop') }}" method="GET" class="search-bar">
            <input type="text" name="search" placeholder="Search smartphones, brands..." value="{{ request.args.get('search', '') }}">
            <button type="submit" aria-label="Search"><i class="fas fa-search"></i></button>
        </form>

        <!-- Desktop & Mobile Drawer Navigation Links -->
        <nav class="nav-links" id="navLinks">
            <!-- Mobile Drawer Header (Only visible on mobile screens <= 768px) -->
            <div class="mobile-nav-header">
                <a href="{{ url_for('index') }}" class="d-flex align-items-center gap-2 text-decoration-none">
                    <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Khemarak_Store Logo" class="navbar-logo-sm">
                    <span class="fw-bold" style="font-size: 1.15rem; color: var(--dark);">Khemarak_Store</span>
                </a>
                <button type="button" class="mobile-nav-close" onclick="toggleMenu()" aria-label="Close menu">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Home -->
            <a href="{{ url_for('index') }}">
                <i class="fas fa-home"></i> Home
            </a>

            <!-- Shop -->
            <a href="{{ url_for('shop') }}">
                <i class="fas fa-store"></i> Shop
            </a>

            <!-- My Orders -->
            <a href="{{ url_for('my_orders') }}">
                <i class="fas fa-bag-shopping"></i> My Orders
            </a>

            <!-- Cart -->
            <a href="{{ url_for('cart') }}" class="cart-icon">
                <span><i class="fas fa-shopping-cart"></i> Cart</span>
                <span class="cart-count">{{ cart_count() }}</span>
            </a>

            {% if is_logged_in() %}
                <!-- Customer Profile -->
                <a href="{{ url_for('profile') }}">
                    <i class="fas fa-user-circle"></i> Profile ({{ current_user().name.split()[0] if current_user() and current_user().name else 'User' }})
                </a>

                <!-- Logout -->
                <a href="{{ url_for('logout') }}" style="color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            {% else %}
                <a href="{{ url_for('login') }}">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
                <a href="{{ url_for('create_user') }}">
                    <i class="fas fa-user-plus"></i> Register
                </a>
            {% endif %}
        </nav>

        <!-- Mobile Quick Controls (Cart + Hamburger Button) -->
        <div class="mobile-controls">
            <a href="{{ url_for('cart') }}" class="mobile-cart-btn" aria-label="View Cart">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">{{ cart_count() }}</span>
            </a>
            <button type="button" class="menu-toggle" onclick="toggleMenu()" aria-label="Open Navigation Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Full-Width Search Bar -->
    <div class="mobile-search-bar">
        <form action="{{ url_for('shop') }}" method="GET">
            <input type="text" name="search" placeholder="Search phones, brands..." value="{{ request.args.get('search', '') }}">
            <button type="submit" aria-label="Search"><i class="fas fa-search"></i></button>
        </form>
    </div>
</header>

<!-- ==========================================
     GLOBAL TOAST & CART JAVASCRIPT
=========================================== -->
<script>
function toggleMenu() {
    const navLinks = document.getElementById('navLinks');
    const overlay = document.getElementById('mobileNavOverlay');
    if (navLinks) navLinks.classList.toggle('active');
    if (overlay) overlay.classList.toggle('active');
    document.body.classList.toggle('nav-open');
}

// Close mobile menu on resize to desktop
window.addEventListener('resize', function() {
    if (window.innerWidth > 768) {
        const navLinks = document.getElementById('navLinks');
        const overlay = document.getElementById('mobileNavOverlay');
        if (navLinks) navLinks.classList.remove('active');
        if (overlay) overlay.classList.remove('active');
        document.body.classList.remove('nav-open');
    }
});

// Close mobile menu on Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        const navLinks = document.getElementById('navLinks');
        const overlay = document.getElementById('mobileNavOverlay');
        if (navLinks && navLinks.classList.contains('active')) {
            navLinks.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            document.body.classList.remove('nav-open');
        }
    }
});

function addToCart(productId, quantity = 1, color = '', storage = '') {
    const formData = new FormData();
    formData.append('product_id', productId);
    formData.append('quantity', quantity);
    formData.append('color', color);
    formData.append('storage', storage);

    const csrfMeta = document.querySelector('meta[name="csrf-token"]');
    const token = csrfMeta ? csrfMeta.getAttribute('content') : '{{ csrf_token() }}';
    if (token) {
        formData.append('csrf_token', token);
    }

    fetch('/add-to-cart', {
        method: 'POST',
        headers: {
            'X-CSRFToken': token
        },
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.querySelectorAll('.cart-count').forEach(badge => {
                badge.innerText = data.cart_count;
            });
            showToast(data.message || 'Added to cart!');
        } else {
            showToast(data.message || 'Could not add to cart', 'error');
        }
    })
    .catch(error => {
        console.error(error);
        showToast('Error adding product to cart', 'error');
    });
}

function showToast(message, type = 'success') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = (type === 'success' ? '<i class="fas fa-check-circle" style="color: #4ade80;"></i> ' : '<i class="fas fa-circle-exclamation" style="color: #f87171;"></i> ') + message;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(20px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 2800);
}
</script>
